name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `package` compiles, runs the unit tests and produces the plugin jar via
      # AMPS without needing a running Jira. The Atlassian repositories are
      # declared in pom.xml, so stock Maven resolves everything.
      - name: Build and test
        run: mvn -B -ntp clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: jira-watcher-field
          path: target/jira-watcher-field-*.jar
          if-no-files-found: error
